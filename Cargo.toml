[package]
name = "doty"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Do That Yourself: a NixOS-driven cleanup orchestrator for frameworks that accumulate temporary local state"
license = "MIT OR Apache-2.0"

[[bin]]
name = "doty"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_fs = "1"
tempfile = "3"

[profile.release]
opt-level = 1
lto = false
codegen-units = 16
strip = false
